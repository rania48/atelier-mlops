name: MLOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate dataset (remote DVC local non accessible en CI)
        run: python src/prepare_data.py

      - name: Execute ML pipeline
        run: dvc repro

      - name: Show metrics
        run: dvc metrics show